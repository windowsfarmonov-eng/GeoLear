<!doctype html>
<html lang="uz" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>GeoLearn — Geografiyani interaktiv o'rganish platformasi</title>
    <meta
      name="description"
      content="GeoLearn — maktablar uchun interaktiv geografiya platformasi: darslar va testlar, jonli o'yinlar, reyting, uy ishlari va 24/7 AI yordamchi. 1–11-sinflar, o'zbek va rus sinflari uchun."
    />
    <meta name="theme-color" content="#161a22" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f9fa" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <link rel="alternate" hreflang="uz" href="%VITE_SITE_URL%/" />
    <link rel="alternate" hreflang="ru" href="%VITE_SITE_URL%/?lang=ru" />
    <link rel="alternate" hreflang="x-default" href="%VITE_SITE_URL%/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GeoLearn" />
    <meta property="og:locale" content="uz_UZ" />
    <meta property="og:locale:alternate" content="ru_RU" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:title" content="GeoLearn — Geografiyani interaktiv o'rganish platformasi" />
    <meta
      property="og:description"
      content="Darslar, testlar, jonli o'yinlar, reyting va AI yordamchi — o'qituvchi va o'quvchi uchun bitta platformada."
    />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="GeoLearn — O'rta Osiyo belgilangan 3D Yer shari" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GeoLearn — Geografiyani interaktiv o'rganish platformasi" />
    <meta
      name="twitter:description"
      content="Darslar, testlar, jonli o'yinlar, reyting va AI yordamchi — o'qituvchi va o'quvchi uchun bitta platformada."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />

    <!-- Icons -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Hero: 3D yuklanguncha ko'rinadigan statik globus -->
    <link rel="preload" as="image" href="/images/globe-fallback.webp" type="image/webp" fetchpriority="high" />

    <script>
      // Mavzu (tema) sahifa chizilishidan oldin qo'llanadi — oq "miltillash" bo'lmasin
      ;(function () {
        try {
          var t = localStorage.getItem('geolearn-theme')
          if (t === 'light') document.documentElement.classList.remove('dark')
          else document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "GeoLearn",
        "url": "%VITE_SITE_URL%/",
        "inLanguage": ["uz", "ru"],
        "description": "Maktablar uchun geografiyani interaktiv o'rgatuvchi onlayn platforma.",
        "publisher": {
          "@type": "Organization",
          "name": "GeoLearn",
          "logo": "%VITE_SITE_URL%/icon-512.png"
        }
      }
    </script>
  </head>
  <body>
    <noscript>
      <div style="font-family: system-ui, sans-serif; padding: 24px; max-width: 640px; margin: 0 auto">
        <h1>GeoLearn — Geografiyani interaktiv o'rganish platformasi</h1>
        <p>Saytning to'liq ko'rinishi uchun JavaScript'ni yoqing. Portallarga to'g'ridan-to'g'ri o'ting:</p>
        <p>
          <a href="%VITE_ADMIN_URL%/dashboard">O'qituvchi paneli</a> ·
          <a href="%VITE_USER_URL%/login">O'quvchi sifatida kirish</a> ·
          <a href="%VITE_USER_URL%/register">Ro'yxatdan o'tish</a>
        </p>
      </div>
    </noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
